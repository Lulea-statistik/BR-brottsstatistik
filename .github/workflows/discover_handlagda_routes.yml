name: Discover Brå handled offences routes

on:
  push:
    branches: [main]
    paths:
      - "scripts/discover_handlagda_routes.py"
      - ".github/workflows/discover_handlagda_routes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/discover_handlagda_routes.py
      - name: Commit discovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/handlagda_route_discovery.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Discover Bra handlagda routes"
            git pull --rebase origin main
            git push
          fi
