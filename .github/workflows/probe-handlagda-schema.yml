name: Probe handled offences Excel schema

on:
  push:
    branches: [main]
    paths:
      - "scripts/inspect_handlagda_schema.py"
      - "requirements.txt"
      - ".github/workflows/probe-handlagda-schema.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/inspect_handlagda_schema.py
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/handlagda_schema_probe.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Probe handled offences Excel schema"
            git pull --rebase origin main
            git push
          fi
