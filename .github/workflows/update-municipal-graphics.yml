name: Update municipal graphics
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/update_municipal_graphics.py
permissions:
  contents: write
jobs:
  update-graphics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: python scripts/update_municipal_graphics.py
      - name: Commit downloaded graphics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- docs/index.html docs/lulea-kommun-mark.png docs/kommun-favicon*
          if ! git diff --cached --quiet; then
            git commit -m "Use official Lulea municipal graphics"
            git push
          fi
