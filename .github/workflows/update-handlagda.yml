name: Update handled offences sources

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_handlagda.py"
      - ".github/workflows/update-handlagda.yml"
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 3"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_handlagda.py
      - name: Commit source catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/handlagda_source_catalog.csv
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update handled offences source catalog"
            git pull --rebase origin main
            git push
          fi
