name: Probe handled offences legacy layout
on:
  push:
    branches: [main]
    paths:
      - "scripts/probe_handlagda_legacy.py"
      - ".github/workflows/probe-handlagda-legacy.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/probe_handlagda_legacy.py
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/handlagda_legacy_probe.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Probe legacy handled offences layout"
            git pull --rebase origin main
            git push
          fi
