name: Build and deploy BRÅ dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "data/annual_all/**"
      - "build_crime_dashboard.py"
      - "requirements.txt"
      - ".github/workflows/deploy-dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bra-dashboard-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dashboard data
        run: python build_crime_dashboard.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
