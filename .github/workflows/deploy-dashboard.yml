name: Build BRÅ dashboard data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/app.js"
      - "docs/style.css"
      - "data/annual_all/**"
      - "build_crime_dashboard.py"
      - "requirements.txt"
      - ".github/workflows/deploy-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: bra-dashboard-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dashboard data
        run: python build_crime_dashboard.py

      - name: Commit generated dashboard data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data

          if git diff --cached --quiet; then
            echo "No dashboard data changes. Nothing to commit."
            exit 0
          fi

          git commit -m "Build BRÅ dashboard data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
