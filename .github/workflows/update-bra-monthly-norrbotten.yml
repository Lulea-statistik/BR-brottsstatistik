name: Update Brå monthly Norrbotten municipalities

on:
  workflow_dispatch:
  schedule:
    - cron: "13 8 * * 0"

permissions:
  contents: write

concurrency:
  group: bra-monthly-norrbotten
  cancel-in-progress: false

jobs:
  fetch-monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch and validate monthly totals for 14 municipalities
        run: python scrape_bra_monthly_norrbotten.py
      - name: Fetch detailed monthly crime categories for 14 municipalities
        run: python scrape_bra_monthly_categories_norrbotten.py
      - name: Commit refreshed source data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monthly_norrbotten.csv data/monthly_norrbotten_categories.csv
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update Brå monthly totals for Norrbotten"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
