name: Build handled offences data

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_handlagda_data.py"
      - "data/handlagda_source_catalog.csv"
      - "requirements.txt"
      - ".github/workflows/build-handlagda-data.yml"
  workflow_dispatch:
  schedule:
    - cron: "7 6 * * 3"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_handlagda_data.py
      - name: Commit normalized data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/handlagda
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build interactive handled offences data"
            git pull --rebase origin main
            git push
          fi
